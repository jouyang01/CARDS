# Cloudflare Worker + one Durable Object per room (M3-ROOM).
#
# M3-DEPLOY-PREP wired the tooling around this file; the publish itself is still
# a separate, deliberate act.
#
#   npm run dev:server   `wrangler dev --local` — the Worker on the real runtime
#   npm run smoke        boot it and check it mints a room (scripts/smoke.mjs)
#   npm run deploy       `wrangler deploy` — needs Cloudflare credentials
#
# `deploy` is DELIBERATELY not run by CI here. That is M3-DEPLOY-LIVE, and it
# needs a credential this repository does not have: the owner's `wrangler login`
# lives on their Mac, and a build container is not logged in. The two ways to
# close that (an API token as a GitHub secret, or the owner running the deploy
# locally) are an owner decision, not something a workflow should assume.
#
# The client finds the deployed Worker through `VITE_WORKER_ORIGIN`, which is the
# `workers.dev` host this `name` produces. Keep the two in step.

name = "cards-rooms"
main = "src/worker.ts"
compatibility_date = "2026-08-16"
# `nodejs_compat` is NOT enabled on purpose: the engine is dependency-free and
# the server imports nothing else, so the Worker runs on the bare runtime. If a
# future item needs a Node built-in, that is a design question first.

[durable_objects]
bindings = [{ name = "ROOMS", class_name = "RoomDurableObject" }]

# A DO class needs a migration to exist. `new_sqlite_classes` is the current
# storage backend for new classes; the older key-value backend is legacy.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDurableObject"]
