<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cards — team tactics duel</title>
    <style>
      :root {
        --bg: #12141a;
        --panel: #1b1e27;
        --grid-line: #2a2e3b;
        --open: #20242f;
        --wall: #4a5065;
        --cover: #6b5b3e;
        --brush: #2e4632;
        --spawn0: #4f8cff;
        --spawn1: #ff6b5e;
        --team0: #4f8cff;
        --team1: #ff6b5e;
        --hp: #5ad17f;
        --shield: #62d0e0;
        --energy: #e0c04f;
        --bar-bg: #12141a;
        --select: #f0f0f0;
        --aim: #ff9a3e;
        --reach: #4f8cff;
        --text: #d7dae2;
      }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
        font-family: system-ui, -apple-system, sans-serif; }
      /* UI-VIEWPORT: the canvas is the app frame. The board used to be a DOM box
         the chrome was subtracted from, so a bigger map pushed the controls off
         the bottom of the screen. Now the board fills the viewport and every
         piece of chrome overlays it — map size and control placement stop being
         the same question. */
      /* The board is a SIBLING of the overlay, not a child of it. Since
         UI-VIEWPORT all three layers are full-viewport and stacked, so `#app`
         needs a z-index above the log for the HUD to be clickable — and if the
         board lived inside `#app` it would inherit that and paint over the log.
         Being siblings lets each layer state its own depth: board under log
         under overlay. It also means the board is not inside a
         `pointer-events: none` subtree, so it receives clicks without opting
         back in. */
      #board { position: fixed; inset: 0; z-index: 0; background: var(--panel); }
      /* The title/status layer floats over everything and must never eat a click
         meant for a tile; its children opt back in if they ever need to. */
      #app { position: fixed; inset: 0; z-index: 5; pointer-events: none;
        padding: 14px 18px; }
      h1 { font-size: 18px; font-weight: 600; margin: 0; letter-spacing: 0.5px;
        text-shadow: 0 2px 10px rgb(0 0 0 / 0.9); }
      #status { text-shadow: 0 2px 10px rgb(0 0 0 / 0.9); }
      footer { display: none; }
      /* The phase label lives in a fixed corner and only changes its text, so
         the eye never hunts for which phase is playing. */
      .phase-label { position: absolute; top: 12px; left: 14px; pointer-events: none;
        font-size: 15px; font-weight: 700; letter-spacing: 3px; color: var(--aim);
        text-shadow: 0 2px 8px rgb(0 0 0 / 0.8); }
      #legend { display: flex; gap: 16px; font-size: 13px; opacity: 0.85; }
      .chip { display: inline-flex; align-items: center; gap: 6px; }
      .swatch { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
      #status { font-size: 15px; font-weight: 600; min-height: 20px; }

      /* ── SCORE1: the in-match readout ─────────────────────────────────────
         Sits directly under the status line in the top chrome, which is the
         region `sizeToViewport` already reserves (TOP_CHROME_PX), so it costs
         the board nothing. `pointer-events: none` because nothing in it is
         clickable and it must never eat a board click near the top edge. */
      .scoreboard { pointer-events: none; display: flex; flex-direction: column;
        gap: 4px; margin-top: 4px; text-shadow: 0 2px 8px rgb(0 0 0 / 0.9); }
      .score-head { display: flex; gap: 18px; align-items: baseline;
        font-size: 15px; font-weight: 700; letter-spacing: 0.5px; }
      .score-clock { font-size: 13px; font-weight: 600; opacity: 0.8; }
      .score-strip { display: flex; flex-wrap: wrap; gap: 8px; font-size: 12px; }
      .score-unit { border-left: 3px solid; padding: 1px 6px; opacity: 0.9;
        background: rgb(0 0 0 / 0.35); border-radius: 3px; }
      .score-unit.dead { opacity: 0.45; text-decoration: line-through; }

      /* ── UI-TOPBAR: friendly portraits · score · turn · score · enemy ─────
         The ordering is the content — your side is on your side, so "how is my
         team doing" is a glance left rather than a read of names. */
      .topbar { display: flex; align-items: center; justify-content: center;
        gap: 22px; flex-wrap: nowrap; }
      .topbar-team { display: flex; gap: 8px; flex: 1; }
      .topbar-team.own { justify-content: flex-end; }
      .topbar-team.foe { justify-content: flex-start; }
      .topbar-portrait { display: flex; flex-direction: column; align-items: center; gap: 3px; width: 40px; }
      .topbar-face { width: 34px; height: 34px; border-radius: 7px; border: 2px solid;
        display: grid; place-items: center; font-size: 16px; font-weight: 800;
        color: #0d0f14; background: rgb(0 0 0 / 0.5); }
      /* A charged ultimate rings the portrait, the same warning the nameplate's
         ULT tag gives — the top strip is where you scan for it first. */
      .topbar-portrait.ult .topbar-face { box-shadow: 0 0 0 2px #ffd76a, 0 0 10px rgb(255 215 106 / 0.6); }
      .topbar-portrait.dead { opacity: 0.5; }
      .topbar-portrait.dead .topbar-face { background: rgb(0 0 0 / 0.6); color: #cbd2e0; }
      /* NET-PRESENCE-UI: two marks, two facts. `away` dims and desaturates —
         nobody is driving this character. `borrowed` is a bright outline: it is
         yours to order, and it is the answer to "why do I have four of these". */
      .topbar-portrait.away { opacity: 0.45; filter: grayscale(0.7); }
      .topbar-portrait.away .topbar-face::after {
        content: '⚠'; position: absolute; font-size: 9px; margin: -14px 0 0 14px; }
      .topbar-portrait.borrowed .topbar-face {
        outline: 2px dashed #ffd76a; outline-offset: 2px; }
      .topbar-portrait.borrowed { opacity: 1; }
      .topbar-hp { width: 36px; height: 4px; border-radius: 2px; background: var(--bar-bg); overflow: hidden; }
      .topbar-hp-fill { height: 100%; background: var(--hp); transition: width 140ms ease-out; }
      .topbar-score { display: grid; grid-template-columns: auto auto auto;
        align-items: baseline; gap: 4px 12px; justify-items: center; }
      .topbar-kills { font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; }
      .topbar-clock { font-size: 13px; font-weight: 700; opacity: 0.85; white-space: nowrap; }
      .topbar-target { grid-column: 1 / -1; font-size: 9px; opacity: 0.5;
        text-transform: uppercase; letter-spacing: 1px; }
      /* The end-of-match breakdown replaces the strip in the same element. */
      .score-table { border-collapse: collapse; font-size: 13px; margin-top: 8px; }
      .score-table th, .score-table td { padding: 2px 12px 2px 0; text-align: right; }
      .score-table th:first-child, .score-table td:first-child { text-align: left; font-weight: 600; }
      .score-table th { font-weight: 600; opacity: 0.7; }

      /* ── UI3: a persistent, viewport-anchored HUD ─────────────────────────
         Bottom-left character panel, bottom-centre hotbar, bottom-right Lock
         In. Anchored so it never moves as the board redraws, and built once —
         see hud.ts for why rebuilding it would break UI1's hover. */
      .hud { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
        pointer-events: auto;
        display: grid; grid-template-columns: minmax(220px, 1fr) auto minmax(220px, 1fr);
        align-items: end; gap: 16px; padding: 12px 18px 14px;
        background: linear-gradient(to top, rgb(9 10 14 / 0.97) 55%, rgb(9 10 14 / 0)); }
      .hud-left { display: grid; grid-template-columns: auto auto; gap: 4px 10px;
        align-items: center; justify-content: start; }
      .hud-portrait { grid-row: span 2; width: 46px; height: 46px; border-radius: 8px;
        display: grid; place-items: center; font-size: 22px; font-weight: 700; color: #0d0f14; }
      .hud-name { font-size: 15px; font-weight: 700; letter-spacing: 0.3px; }
      .hud-role { font-size: 11px; opacity: 0.6; text-transform: uppercase; letter-spacing: 1px; }
      .hud-bars { grid-column: 1 / -1; display: flex; flex-direction: column; gap: 3px; min-width: 210px; }
      .hud-bar { display: grid; grid-template-columns: 22px 1fr auto; gap: 6px;
        align-items: center; font-size: 10px; }
      .hud-bar-label { opacity: 0.55; letter-spacing: 1px; }
      .hud-bar-track { height: 7px; border-radius: 4px; background: var(--bar-bg); overflow: hidden; }
      .hud-bar-fill { height: 100%; width: 0; border-radius: 4px; background: var(--hp);
        transition: width 140ms ease-out; }
      .hud-bar-track.shield .hud-bar-fill { background: var(--shield); }
      .hud-bar-track.energy .hud-bar-fill { background: var(--energy); }
      .hud-bar-value { opacity: 0.7; font-variant-numeric: tabular-nums; }
      /* BUFF-UI: the buff/debuff strip. The floating pips say something is on
         you; this says what, and for how long. Debuffs get a red left edge so
         the two families separate without relying on the dot colour alone —
         eleven colours is more than a player should have to memorise, and it
         gives a colour-blind player nothing. */
      .hud-statuses { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 4px;
        margin-top: 3px; max-width: 260px; }
      .hud-status { display: inline-flex; align-items: center; gap: 5px;
        padding: 3px 7px 3px 5px; border-radius: 4px; font-size: 11px; line-height: 1.4;
        background: rgb(255 255 255 / 0.07); border-left: 3px solid #6fbf73; }
      .hud-status.harm { border-left-color: #d2624f; }
      /* STATUS-ICONS-SIZE: the HUD strip's glyph grows with the board's. */
      .hud-status-dot { width: 18px; height: 18px; flex: none; display: block; }
      .hud-status-dot svg { width: 100%; height: 100%; display: block; }
      .hud-status-name { font-weight: 600; letter-spacing: 0.2px; }
      .hud-status-amount { opacity: 0.85; font-variant-numeric: tabular-nums; }
      .hud-status-turns { opacity: 0.55; font-variant-numeric: tabular-nums; }

      /* UI-INSPECT: the hover panel. Fixed to the viewport like the tooltip,
         above the HUD but never capturing the pointer — it follows the mouse,
         so a panel that could be hovered would chase itself off the unit. */
      .inspect { position: fixed; z-index: 7; pointer-events: none;
        min-width: 178px; max-width: 240px; padding: 8px 10px 9px;
        border-radius: 8px; border: 1px solid #2b3140; border-left: 3px solid #4f8cff;
        background: rgb(12 14 19 / 0.96); font-size: 11px; line-height: 1.45;
        box-shadow: 0 8px 24px rgb(0 0 0 / 0.5); }
      .inspect.t1 { border-left-color: #ff6b5e; }
      .inspect-name { font-size: 13px; font-weight: 700; }
      .inspect-role { font-size: 9px; opacity: 0.55; text-transform: uppercase; letter-spacing: 1px; }
      .inspect-vitals { display: flex; justify-content: space-between; gap: 10px;
        margin: 5px 0 6px; font-variant-numeric: tabular-nums; }
      .inspect-hp { color: #5ad17f; }
      .inspect-energy { color: #e0c04f; opacity: 0.8; }
      .inspect-energy.ult { opacity: 1; font-weight: 700; color: #ffd76a; }
      .inspect-slot { display: flex; justify-content: space-between; gap: 10px; }
      .inspect-slot.ult .inspect-slot-name { color: #c4aef0; }
      .inspect-slot.down { opacity: 0.45; }
      .inspect-slot-note { opacity: 0.6; font-variant-numeric: tabular-nums; }
      .inspect-catalysts { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
      .inspect-catalyst { font-size: 9px; padding: 1px 5px; border-radius: 3px;
        background: rgb(255 255 255 / 0.08); }
      /* Spent slots go grey rather than vanishing: "what have they already
         burned" is half the read, and an empty row cannot answer it. */
      .inspect-catalyst.spent { opacity: 0.38; text-decoration: line-through; }
      .inspect-statuses { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }

      .hud-switcher { grid-column: 1 / -1; display: flex; gap: 6px; margin-top: 2px; }
      .hud-chip { font-size: 11px; padding: 3px 8px; }

      .hud-centre { display: flex; flex-direction: column; align-items: center; gap: 6px; }
      .hud-hotbar { display: flex; gap: 6px; }
      /* UI-VIEWPORT: every control is at least 44×44. Below that a hotbar
         button is a target you have to aim at rather than one you hit, and the
         breakpoints below narrow the *width* only — never the height. */
      .hud-ability { display: flex; flex-direction: column; align-items: center;
        justify-content: center; gap: 2px;
        min-width: 92px; min-height: 44px; padding: 8px 10px; font-size: 12px; line-height: 1.25; }
      .hud-ability.ult { border-color: #6b5b8e; }
      /* A free action is additive, so it reads as its own thing in the hotbar
         (FREE-UI) — green like the Prep catalyst slot it shares a phase with. */
      .hud-ability.free { border-left: 3px solid #6fbf73; }
      .hud-ability.sel { border-color: var(--aim); color: var(--aim); }
      .hud-ability-name { font-weight: 600; }
      .hud-ability-note { font-size: 10px; opacity: 0.6; }
      /* Catalysts (CAT2): once per match, so they read as a resource strip —
         smaller than the hotbar, colour-coded by the phase they fire in. */
      .hud-catalysts { display: flex; gap: 6px; justify-content: center; }
      .hud-catalyst { display: flex; flex-direction: column; align-items: center;
        justify-content: center; gap: 1px;
        min-width: 84px; min-height: 44px; padding: 4px 8px; font-size: 11px; line-height: 1.2;
        border-color: #4a4a52; }
      .hud-catalyst[data-phase="prep"] { border-left: 3px solid #6fbf73; }
      .hud-catalyst[data-phase="dash"] { border-left: 3px solid #e0c04a; }
      .hud-catalyst[data-phase="blast"] { border-left: 3px solid #e0664a; }
      .hud-catalyst.sel { border-color: var(--aim); color: var(--aim); }
      .hud-catalyst.spent { opacity: 0.35; text-decoration: line-through; }
      .hud-moves { display: flex; gap: 6px; }
      .hud-move { font-size: 11px; padding: 3px 10px; min-width: 44px; min-height: 44px; }

      .hud-right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
      .hud-view { display: flex; gap: 6px; }
      /* ── TIMER-BAR: a draining bar across the hotbar, running into Lock In ─
         Dev Notes #6+#7, one redesign. The two things a player watches in the
         last ten seconds are how long is left and the button that ends it, so
         they are one object spanning the abilities they apply to rather than a
         number stacked in a corner. `align-items: stretch` and the joined
         corners below are what make it read as one object and not as a bar
         that happens to sit next to a button.

         Tenths and the colour shift still arrive together below ten seconds:
         one signal, and a precise number in a calm colour is worse than either
         alone. The bar takes the same cue, so the read works peripherally. */
      .hud-lockrow { display: flex; align-items: stretch; gap: 0; width: 100%; }
      .hud-timer { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0;
        padding: 0 10px; background: rgb(255 255 255 / 0.04);
        border: 1px solid #2b3140; border-right: none;
        border-radius: 6px 0 0 6px; }
      .hud-timer-track { position: relative; flex: 1; min-width: 40px; height: 10px;
        border-radius: 5px; background: rgb(255 255 255 / 0.08); overflow: hidden; }
      /* Width is set from `fraction`; the transition is what makes it *drain*
         rather than step, and it is short enough not to lie about the deadline. */
      .hud-timer-fill { position: absolute; inset: 0 auto 0 0; width: 100%;
        border-radius: 5px; background: var(--reach); transition: width 120ms linear; }
      .hud-timer-fill.urgent { background: #ff8a5c; }
      .hud-timer-fill.expired { background: #d2624f; opacity: 0.5; }
      .hud-timer-text { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums;
        letter-spacing: 0.5px; min-width: 58px; text-align: right; }
      .hud-timer-text.urgent { color: #ff8a5c; }
      .hud-timer-text.expired { color: #d2624f; opacity: 0.75; }
      /* The bank extension has to be SEEN. A +10 s that silently changed the
         number reads as a miscount. */
      @keyframes bank-flash { 0% { transform: scale(1); } 35% { transform: scale(1.22); } 100% { transform: scale(1); } }
      .hud-timer.extending .hud-timer-text { animation: bank-flash 900ms ease-out; color: #6fbf73; }
      /* UI-VIEWPORT's 44x44 minimum applies here too: the bank pip is a button,
         and "it is only a pip" is exactly the reasoning that produced the
         controls that ruling exists to fix. */
      .hud-bank { min-width: 44px; min-height: 44px; padding: 0 8px; font-size: 15px;
        line-height: 1; color: #ffd76a; border-color: #6a5a2a; }
      /* Spent reads as an empty socket rather than as nothing, so the resource
         stays legible after it is gone. */
      .hud-bank.spent { color: #6b7180; border-color: #2b3140; }
      .hud-small { font-size: 11px; padding: 3px 8px; min-width: 44px; min-height: 44px; }
      .hud-lock { background: var(--reach); color: #fff; border-color: var(--reach);
        font-weight: 700; font-size: 14px; padding: 10px 20px;
        min-width: 44px; min-height: 44px; }
      /* TIMER-BAR: the enlarged Lock In at the bar's right end. Bigger than
         anything else on the HUD on purpose — it is the one control every turn
         ends with — and square on its left edge so the bar runs into it. */
      .hud-lockrow .hud-lock { font-size: 17px; padding: 12px 30px; min-height: 52px;
        border-radius: 0 6px 6px 0; flex: none; }
      .hud-playback { grid-column: 1 / -1; display: flex; justify-content: center; }

      /* ── UI5: floating damage / absorb / heal / shield readouts ───────────
         Four visually distinct treatments, not four white numbers: the point
         is telling at a glance whether a shield ate the hit. */
      .readouts { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
      .readout { position: absolute; transform: translate(-50%, -100%); white-space: nowrap;
        font-weight: 800; font-variant-numeric: tabular-nums;
        text-shadow: 0 1px 3px #000, 0 0 10px rgb(0 0 0 / 0.8); }
      .readout.damage { color: #ff6b5e; font-size: 20px; }
      .readout.absorb { color: var(--shield); font-size: 13px; font-weight: 700; }
      .readout.heal { color: var(--hp); font-size: 18px; }
      .readout.shield { color: var(--shield); font-size: 14px; font-weight: 700; }
      /* PREVIEW-NUMBERS: the same three colours, because red should mean damage
         once and not twice — but outlined and slightly smaller, so "this WILL
         happen" never reads as "this just happened". */
      .readout.preview { font-size: 15px; font-weight: 700; opacity: 0.95;
        padding: 0 4px; border-radius: 4px; background: rgb(10 12 16 / 0.55);
        border: 1px solid currentColor; }
      .readout.preview.damage { font-size: 16px; }

      /* CAT-COST-LABEL: the cost a catalyst charges, in the same visual register
         as the free-ability tag — green for additive, amber for the Dash slot
         that *is* your turn, so the exception reads as an exception. */
      .hud-catalyst-cost { font-size: 9px; letter-spacing: 0.04em; text-transform: uppercase;
        padding: 0 3px; border-radius: 3px; white-space: nowrap; }
      .hud-catalyst-cost.free { color: #6fbf73; border: 1px solid #6fbf7355; }
      .hud-catalyst-cost.action { color: #ffd23f; border: 1px solid #ffd23f55; }

      /* ── UI6: the combat log, right side, independently scrollable ───────── */
      .log { position: fixed; top: 0; right: 0; bottom: 0; width: 300px; z-index: 4;
        pointer-events: auto;
        overflow-y: auto; overscroll-behavior: contain;
        padding: 16px 14px 200px; font-size: 12px; line-height: 1.5;
        background: rgb(16 18 24 / 0.92); border-left: 1px solid var(--grid-line); }
      .log-list { display: flex; flex-direction: column; gap: 2px; }
      .log-turn { margin: 10px 0 4px; padding-top: 6px; border-top: 1px solid var(--grid-line);
        font-size: 10px; letter-spacing: 2px; text-transform: uppercase; opacity: 0.5; }
      .log-turn:first-child { margin-top: 0; border-top: none; padding-top: 0; }
      .log-line { opacity: 0.9; }
      .log-line.damage { color: #ff9b90; }
      .log-line.heal { color: var(--hp); }
      .log-line.shield { color: var(--shield); }
      .log-line.status { color: var(--aim); opacity: 0.85; }
      .log-line.death { color: #ff6b5e; font-weight: 700; }
      .log-line.respawn { color: var(--reach); }
      .log-line.neutral { color: var(--text); font-weight: 700; }
      button { background: var(--open); color: var(--text); border: 1px solid var(--grid-line);
        border-radius: 6px; padding: 5px 10px; font-size: 13px; cursor: pointer; }
      button:hover:not(:disabled) { border-color: var(--reach); }
      button:disabled { opacity: 0.4; cursor: not-allowed; }
      button.sel { border-color: var(--aim); color: var(--aim); }
      button.primary { background: var(--reach); color: #fff; border-color: var(--reach); font-weight: 600; }
      .tooltip { position: fixed; z-index: 10; max-width: 280px; background: var(--panel);
        color: var(--text); border: 1px solid var(--grid-line); border-radius: 6px;
        padding: 8px 10px; font-size: 12px; line-height: 1.5; white-space: pre-line;
        box-shadow: 0 4px 16px rgb(0 0 0 / 0.5); pointer-events: none; }
      footer { font-size: 12px; opacity: 0.5; }

      /* ── M3-END-SCREEN: the verdict and the way out ───────────────────────
         Inside the score panel, which is already where a finished match puts
         the player's attention. */
      .end-headline { margin: 0 0 6px; font-size: 22px; letter-spacing: 0.04em; }
      .end-headline.is-won { color: var(--hp); }
      .end-headline.is-lost { color: var(--spawn1); }
      .end-headline.is-draw { color: var(--aim); }
      .end-exit { display: inline-block; margin-top: 12px; font-size: 13px;
        color: var(--aim); text-decoration: none; border-bottom: 1px solid currentColor; }
      .end-exit:hover { opacity: 0.8; }

      /* ── CREATE-LINK: the way out of the hot-seat ─────────────────────────
         `#app` is pointer-events:none so the board can be clicked through it,
         so the one interactive thing in it has to opt back in. */
      #create-link { pointer-events: auto; display: inline-block; margin: 2px 0 4px;
        font-size: 12px; color: var(--aim); text-decoration: none;
        border-bottom: 1px solid currentColor; }
      #create-link:hover { opacity: 0.8; }

      /* ── M3-WAIT-STATE / M3-CONN-STATE: why the board is not taking orders ─
         Beside Lock In, where a player is already looking when they finish a
         turn. Amber rather than red: a locked turn is the normal state of a
         simultaneous game, not an error. */
      .hud-banner { font-size: 11px; line-height: 1.3; max-width: 190px; text-align: right;
        color: var(--aim); opacity: 0.9; }

      /* ── M3-LOBBY-UI: the pick screen ─────────────────────────────────────
         Mounted into #board, which is the full-viewport layer, so it scrolls on
         its own rather than fighting the fixed HUD chrome around it. Plain
         flow layout: a lobby is a form, and the board's absolute positioning
         buys it nothing. */
      .lobby { position: relative; z-index: 1; max-width: 860px; margin: 0 auto;
        padding: 72px 20px 40px; overflow-y: auto; max-height: 100vh;
        /* LOBBY-BOUNDS: the panel is the boundary. Vertical scrolling is the
           lobby's own; horizontal scrolling would mean something inside had
           already escaped, and hiding it is the last line of defence behind
           the wrapping rules rather than the mechanism. */
        overflow-x: hidden; box-sizing: border-box; }
      .lobby h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em;
        opacity: 0.6; margin: 20px 0 8px; }
      .lobby h3 { font-size: 12px; opacity: 0.6; margin: 16px 0 6px; font-weight: 500; }
      .lobby-status { font-size: 14px; margin: 0 0 4px; }
      .lobby-error { color: var(--spawn1); font-size: 13px; margin: 0 0 8px; }
      /* LOBBY-BOUNDS (Dev Note #1): the row clips inside its panel.
         A seat line is a name on the left and a pick list on the right, and at
         8 seats with three-character names the pick list is the longest string
         on the screen. `space-between` on a flex row does not shrink anything —
         the row simply grew past the panel and ran into the log beside it.
         Three rules, and the reason for each:
           • `flex-wrap` lets the picks drop under the name instead of pushing
             the row wider, which is the behaviour at the narrowest sizes;
           • `min-width: 0` on the children, because a flex item's default
             `min-width: auto` refuses to shrink below its content and is what
             makes "it overflows anyway" the usual outcome of trying this;
           • `overflow-wrap: anywhere` so a single unbroken token — a long
             player name pasted in — breaks rather than being the exception
             that defeats all of the above. */
      .lobby-seat { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px;
        padding: 8px 12px; border: 1px solid var(--grid-line); border-radius: 6px;
        margin-bottom: 6px; background: var(--panel); font-size: 13px;
        max-width: 100%; overflow-wrap: anywhere; }
      .lobby-seat-name { min-width: 0; overflow-wrap: anywhere; }
      .lobby-team { max-width: 100%; }
      /* Your own row is the one carrying the controls below it, so it is the one
         that has to be findable at a glance. */
      .lobby-seat.is-mine { border-color: var(--team0); }
      .lobby-seat.is-ready { border-left: 3px solid var(--hp); }
      /* A held seat, not an empty one: dimmed so it reads as absent, still
         listed because M3-RECONNECT is keeping it for its owner. */
      .lobby-seat.is-away { opacity: 0.55; border-left: 3px solid #ffd76a; }
      .lobby-seat.is-away .lobby-seat-picks { font-style: italic; }
      /* NET-PRESENCE-ENEMY: shown only when somebody is missing, so it is
         allowed to read as a warning rather than as a status line. */
      .lobby-enemy-present { color: #ffd76a; }
      /* BASIC-MODES: the aim-time toggle, under the ability it belongs to.
         Deliberately smaller than an ability button — it changes how the armed
         ability aims, it does not arm one. */
      .hud-modes { display: flex; gap: 6px; justify-content: center; margin-top: 4px; }
      .hud-mode { font-size: 11px; padding: 2px 10px; border-radius: 10px;
        background: rgb(255 255 255 / 0.06); color: #cbd2e0;
        border: 1px solid rgb(255 255 255 / 0.15); cursor: pointer; }
      .hud-mode.sel { background: var(--team0); color: #0b0d12; border-color: var(--team0); }
      /* Right-aligned so the two halves still read as columns when the row is
         wide enough not to wrap; `min-width: 0` for the reason above. */
      .lobby-seat-picks { opacity: 0.7; min-width: 0; overflow-wrap: anywhere; text-align: right; }
      /* The enemy is a count and never a name (BLIND-PICK) — there is nothing
         here to style because there is nothing here to show. */
      .lobby-enemy-count { font-size: 13px; opacity: 0.7; margin: 0; }
      .lobby-slots, .lobby-characters, .lobby-catalyst-row { display: flex; flex-wrap: wrap; gap: 6px; }
      .lobby-slot.is-active { border-color: var(--aim); color: var(--aim); }
      .lobby-character { min-width: 150px; text-align: left; }
      .lobby-character.is-chosen { border-color: var(--aim); color: var(--aim); }
      /* Greyed because R3 refuses it — a teammate already has that character. */
      .lobby-character.is-taken { opacity: 0.35; }
      .lobby-catalyst-row { align-items: center; margin-bottom: 4px; }
      .lobby-phase { min-width: 52px; font-size: 11px; text-transform: uppercase;
        letter-spacing: 0.06em; opacity: 0.6; }
      .lobby-catalyst { font-size: 11px; padding: 4px 8px; }
      .lobby-catalyst.is-chosen { border-color: var(--aim); color: var(--aim); }
      .lobby-start { margin-top: 24px; padding: 10px 20px; font-size: 14px; }
      .lobby-start:disabled { opacity: 0.4; cursor: not-allowed; }

      /* ── M3-ROOM-CREATE: the host's form, inside the same .lobby column ──── */
      .create-hint { font-size: 12px; opacity: 0.6; margin: 0 0 16px; max-width: 46em; }
      .create-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
      .create-label { min-width: 64px; font-size: 12px; text-transform: uppercase;
        letter-spacing: 0.06em; opacity: 0.6; }
      .create-row select { background: var(--open); color: var(--text);
        border: 1px solid var(--grid-line); border-radius: 4px; padding: 6px 8px; font: inherit; }
      .create-error { color: var(--spawn1); font-size: 13px; margin: 8px 0 0; }
      .create-submit { margin-top: 20px; padding: 10px 20px; font-size: 14px; }
      .create-submit:disabled { opacity: 0.4; cursor: not-allowed; }

      /* ── UI-responsive: the fixed chrome has to give way on a laptop ───────
         The HUD and log are position:fixed, so below ~1200px they would simply
         cover the board. `sizeToContainer` measures them rather than assuming,
         so shrinking them here is all that is needed — the board re-fits. */
      @media (max-width: 1400px) {
        .log { width: 240px; }
        .hud-ability { min-width: 78px; padding: 7px 8px; font-size: 11px; }
        .hud-catalyst { min-width: 70px; padding: 3px 6px; font-size: 10px; }
        /* Width only — `min-height: 44px` above is never overridden. */
      }
      @media (max-width: 1100px) {
        /* The log stops being a column and becomes a short strip above the HUD,
           so the board keeps the full width — on a laptop the board is what you
           are actually looking at. */
        .log { top: auto; left: 0; width: auto; height: 116px; bottom: 132px;
          padding: 10px 14px; border-left: none; border-top: 1px solid var(--grid-line); }
        .hud { grid-template-columns: auto 1fr auto; gap: 10px; padding: 8px 12px 10px; }
        .hud-bars { min-width: 150px; }
        .hud-portrait { width: 38px; height: 38px; font-size: 18px; }
        .hud-lock { font-size: 13px; padding: 8px 14px; }
        .hud-lockrow .hud-lock { font-size: 15px; padding: 10px 18px; min-height: 48px; }
        .hud-timer-text { font-size: 18px; min-width: 46px; }
        h1 { font-size: 16px; }
      }
      @media (max-width: 820px) {
        /* Narrower than this the character panel is the first thing to go —
           its HP/energy are also on the unit's own billboarded bars. */
        .hud-left { display: none; }
        .hud { grid-template-columns: 1fr auto; }
      }
    </style>
  </head>
  <body>
    <div id="board"></div>
    <aside id="log" class="log"></aside>
    <div id="app">
      <h1>CARDS — Duel Arena</h1>
      <!-- CREATE-LINK: `?create` has existed since M3-ROOM-CREATE and nothing
           pointed at it, so a host had to know to type it. This is the whole
           end-to-end loop's front door: hot-seat → create → share the code. -->
      <a id="create-link" href="?create">Play online — create a room ▸</a>
      <div id="status"></div>
      <div id="controls" class="hud"></div>
      <footer>M2 hot-seat · order entry, resolution & playback driven entirely by the engine</footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
