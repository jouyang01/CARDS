<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cards — team tactics duel</title>
    <style>
      :root {
        --bg: #12141a;
        --panel: #1b1e27;
        --grid-line: #2a2e3b;
        --open: #20242f;
        --wall: #4a5065;
        --cover: #6b5b3e;
        --brush: #2e4632;
        --spawn0: #4f8cff;
        --spawn1: #ff6b5e;
        --team0: #4f8cff;
        --team1: #ff6b5e;
        --hp: #5ad17f;
        --shield: #62d0e0;
        --energy: #e0c04f;
        --bar-bg: #12141a;
        --select: #f0f0f0;
        --aim: #ff9a3e;
        --reach: #4f8cff;
        --text: #d7dae2;
      }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
        font-family: system-ui, -apple-system, sans-serif; }
      /* UI-VIEWPORT: the canvas is the app frame. The board used to be a DOM box
         the chrome was subtracted from, so a bigger map pushed the controls off
         the bottom of the screen. Now the board fills the viewport and every
         piece of chrome overlays it — map size and control placement stop being
         the same question. */
      /* The board is a SIBLING of the overlay, not a child of it. Since
         UI-VIEWPORT all three layers are full-viewport and stacked, so `#app`
         needs a z-index above the log for the HUD to be clickable — and if the
         board lived inside `#app` it would inherit that and paint over the log.
         Being siblings lets each layer state its own depth: board under log
         under overlay. It also means the board is not inside a
         `pointer-events: none` subtree, so it receives clicks without opting
         back in. */
      #board { position: fixed; inset: 0; z-index: 0; background: var(--panel); }
      /* The title/status layer floats over everything and must never eat a click
         meant for a tile; its children opt back in if they ever need to. */
      #app { position: fixed; inset: 0; z-index: 5; pointer-events: none;
        padding: 14px 18px; }
      h1 { font-size: 18px; font-weight: 600; margin: 0; letter-spacing: 0.5px;
        text-shadow: 0 2px 10px rgb(0 0 0 / 0.9); }
      #status { text-shadow: 0 2px 10px rgb(0 0 0 / 0.9); }
      footer { display: none; }
      /* The phase label lives in a fixed corner and only changes its text, so
         the eye never hunts for which phase is playing. */
      .phase-label { position: absolute; top: 12px; left: 14px; pointer-events: none;
        font-size: 15px; font-weight: 700; letter-spacing: 3px; color: var(--aim);
        text-shadow: 0 2px 8px rgb(0 0 0 / 0.8); }
      #legend { display: flex; gap: 16px; font-size: 13px; opacity: 0.85; }
      .chip { display: inline-flex; align-items: center; gap: 6px; }
      .swatch { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
      #status { font-size: 15px; font-weight: 600; min-height: 20px; }

      /* ── SCORE1: the in-match readout ─────────────────────────────────────
         Sits directly under the status line in the top chrome, which is the
         region `sizeToViewport` already reserves (TOP_CHROME_PX), so it costs
         the board nothing. `pointer-events: none` because nothing in it is
         clickable and it must never eat a board click near the top edge. */
      .scoreboard { pointer-events: none; display: flex; flex-direction: column;
        gap: 4px; margin-top: 4px; text-shadow: 0 2px 8px rgb(0 0 0 / 0.9); }
      .score-head { display: flex; gap: 18px; align-items: baseline;
        font-size: 15px; font-weight: 700; letter-spacing: 0.5px; }
      .score-clock { font-size: 13px; font-weight: 600; opacity: 0.8; }
      .score-strip { display: flex; flex-wrap: wrap; gap: 8px; font-size: 12px; }
      .score-unit { border-left: 3px solid; padding: 1px 6px; opacity: 0.9;
        background: rgb(0 0 0 / 0.35); border-radius: 3px; }
      .score-unit.dead { opacity: 0.45; text-decoration: line-through; }
      /* The end-of-match breakdown replaces the strip in the same element. */
      .score-table { border-collapse: collapse; font-size: 13px; margin-top: 8px; }
      .score-table th, .score-table td { padding: 2px 12px 2px 0; text-align: right; }
      .score-table th:first-child, .score-table td:first-child { text-align: left; font-weight: 600; }
      .score-table th { font-weight: 600; opacity: 0.7; }

      /* ── UI3: a persistent, viewport-anchored HUD ─────────────────────────
         Bottom-left character panel, bottom-centre hotbar, bottom-right Lock
         In. Anchored so it never moves as the board redraws, and built once —
         see hud.ts for why rebuilding it would break UI1's hover. */
      .hud { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
        pointer-events: auto;
        display: grid; grid-template-columns: minmax(220px, 1fr) auto minmax(220px, 1fr);
        align-items: end; gap: 16px; padding: 12px 18px 14px;
        background: linear-gradient(to top, rgb(9 10 14 / 0.97) 55%, rgb(9 10 14 / 0)); }
      .hud-left { display: grid; grid-template-columns: auto auto; gap: 4px 10px;
        align-items: center; justify-content: start; }
      .hud-portrait { grid-row: span 2; width: 46px; height: 46px; border-radius: 8px;
        display: grid; place-items: center; font-size: 22px; font-weight: 700; color: #0d0f14; }
      .hud-name { font-size: 15px; font-weight: 700; letter-spacing: 0.3px; }
      .hud-role { font-size: 11px; opacity: 0.6; text-transform: uppercase; letter-spacing: 1px; }
      .hud-bars { grid-column: 1 / -1; display: flex; flex-direction: column; gap: 3px; min-width: 210px; }
      .hud-bar { display: grid; grid-template-columns: 22px 1fr auto; gap: 6px;
        align-items: center; font-size: 10px; }
      .hud-bar-label { opacity: 0.55; letter-spacing: 1px; }
      .hud-bar-track { height: 7px; border-radius: 4px; background: var(--bar-bg); overflow: hidden; }
      .hud-bar-fill { height: 100%; width: 0; border-radius: 4px; background: var(--hp);
        transition: width 140ms ease-out; }
      .hud-bar-track.shield .hud-bar-fill { background: var(--shield); }
      .hud-bar-track.energy .hud-bar-fill { background: var(--energy); }
      .hud-bar-value { opacity: 0.7; font-variant-numeric: tabular-nums; }
      .hud-switcher { grid-column: 1 / -1; display: flex; gap: 6px; margin-top: 2px; }
      .hud-chip { font-size: 11px; padding: 3px 8px; }

      .hud-centre { display: flex; flex-direction: column; align-items: center; gap: 6px; }
      .hud-hotbar { display: flex; gap: 6px; }
      /* UI-VIEWPORT: every control is at least 44×44. Below that a hotbar
         button is a target you have to aim at rather than one you hit, and the
         breakpoints below narrow the *width* only — never the height. */
      .hud-ability { display: flex; flex-direction: column; align-items: center;
        justify-content: center; gap: 2px;
        min-width: 92px; min-height: 44px; padding: 8px 10px; font-size: 12px; line-height: 1.25; }
      .hud-ability.ult { border-color: #6b5b8e; }
      /* A free action is additive, so it reads as its own thing in the hotbar
         (FREE-UI) — green like the Prep catalyst slot it shares a phase with. */
      .hud-ability.free { border-left: 3px solid #6fbf73; }
      .hud-ability.sel { border-color: var(--aim); color: var(--aim); }
      .hud-ability-name { font-weight: 600; }
      .hud-ability-note { font-size: 10px; opacity: 0.6; }
      /* Catalysts (CAT2): once per match, so they read as a resource strip —
         smaller than the hotbar, colour-coded by the phase they fire in. */
      .hud-catalysts { display: flex; gap: 6px; justify-content: center; }
      .hud-catalyst { display: flex; flex-direction: column; align-items: center;
        justify-content: center; gap: 1px;
        min-width: 84px; min-height: 44px; padding: 4px 8px; font-size: 11px; line-height: 1.2;
        border-color: #4a4a52; }
      .hud-catalyst[data-phase="prep"] { border-left: 3px solid #6fbf73; }
      .hud-catalyst[data-phase="dash"] { border-left: 3px solid #e0c04a; }
      .hud-catalyst[data-phase="blast"] { border-left: 3px solid #e0664a; }
      .hud-catalyst.sel { border-color: var(--aim); color: var(--aim); }
      .hud-catalyst.spent { opacity: 0.35; text-decoration: line-through; }
      .hud-moves { display: flex; gap: 6px; }
      .hud-move { font-size: 11px; padding: 3px 10px; min-width: 44px; min-height: 44px; }

      .hud-right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
      .hud-view { display: flex; gap: 6px; }
      .hud-small { font-size: 11px; padding: 3px 8px; min-width: 44px; min-height: 44px; }
      .hud-lock { background: var(--reach); color: #fff; border-color: var(--reach);
        font-weight: 700; font-size: 14px; padding: 10px 20px;
        min-width: 44px; min-height: 44px; }
      .hud-playback { grid-column: 1 / -1; display: flex; justify-content: center; }

      /* ── UI5: floating damage / absorb / heal / shield readouts ───────────
         Four visually distinct treatments, not four white numbers: the point
         is telling at a glance whether a shield ate the hit. */
      .readouts { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
      .readout { position: absolute; transform: translate(-50%, -100%); white-space: nowrap;
        font-weight: 800; font-variant-numeric: tabular-nums;
        text-shadow: 0 1px 3px #000, 0 0 10px rgb(0 0 0 / 0.8); }
      .readout.damage { color: #ff6b5e; font-size: 20px; }
      .readout.absorb { color: var(--shield); font-size: 13px; font-weight: 700; }
      .readout.heal { color: var(--hp); font-size: 18px; }
      .readout.shield { color: var(--shield); font-size: 14px; font-weight: 700; }
      /* PREVIEW-NUMBERS: the same three colours, because red should mean damage
         once and not twice — but outlined and slightly smaller, so "this WILL
         happen" never reads as "this just happened". */
      .readout.preview { font-size: 15px; font-weight: 700; opacity: 0.95;
        padding: 0 4px; border-radius: 4px; background: rgb(10 12 16 / 0.55);
        border: 1px solid currentColor; }
      .readout.preview.damage { font-size: 16px; }

      /* CAT-COST-LABEL: the cost a catalyst charges, in the same visual register
         as the free-ability tag — green for additive, amber for the Dash slot
         that *is* your turn, so the exception reads as an exception. */
      .hud-catalyst-cost { font-size: 9px; letter-spacing: 0.04em; text-transform: uppercase;
        padding: 0 3px; border-radius: 3px; white-space: nowrap; }
      .hud-catalyst-cost.free { color: #6fbf73; border: 1px solid #6fbf7355; }
      .hud-catalyst-cost.action { color: #ffd23f; border: 1px solid #ffd23f55; }

      /* ── UI6: the combat log, right side, independently scrollable ───────── */
      .log { position: fixed; top: 0; right: 0; bottom: 0; width: 300px; z-index: 4;
        pointer-events: auto;
        overflow-y: auto; overscroll-behavior: contain;
        padding: 16px 14px 200px; font-size: 12px; line-height: 1.5;
        background: rgb(16 18 24 / 0.92); border-left: 1px solid var(--grid-line); }
      .log-list { display: flex; flex-direction: column; gap: 2px; }
      .log-turn { margin: 10px 0 4px; padding-top: 6px; border-top: 1px solid var(--grid-line);
        font-size: 10px; letter-spacing: 2px; text-transform: uppercase; opacity: 0.5; }
      .log-turn:first-child { margin-top: 0; border-top: none; padding-top: 0; }
      .log-line { opacity: 0.9; }
      .log-line.damage { color: #ff9b90; }
      .log-line.heal { color: var(--hp); }
      .log-line.shield { color: var(--shield); }
      .log-line.status { color: var(--aim); opacity: 0.85; }
      .log-line.death { color: #ff6b5e; font-weight: 700; }
      .log-line.respawn { color: var(--reach); }
      .log-line.neutral { color: var(--text); font-weight: 700; }
      button { background: var(--open); color: var(--text); border: 1px solid var(--grid-line);
        border-radius: 6px; padding: 5px 10px; font-size: 13px; cursor: pointer; }
      button:hover:not(:disabled) { border-color: var(--reach); }
      button:disabled { opacity: 0.4; cursor: not-allowed; }
      button.sel { border-color: var(--aim); color: var(--aim); }
      button.primary { background: var(--reach); color: #fff; border-color: var(--reach); font-weight: 600; }
      .tooltip { position: fixed; z-index: 10; max-width: 280px; background: var(--panel);
        color: var(--text); border: 1px solid var(--grid-line); border-radius: 6px;
        padding: 8px 10px; font-size: 12px; line-height: 1.5; white-space: pre-line;
        box-shadow: 0 4px 16px rgb(0 0 0 / 0.5); pointer-events: none; }
      footer { font-size: 12px; opacity: 0.5; }

      /* ── UI-responsive: the fixed chrome has to give way on a laptop ───────
         The HUD and log are position:fixed, so below ~1200px they would simply
         cover the board. `sizeToContainer` measures them rather than assuming,
         so shrinking them here is all that is needed — the board re-fits. */
      @media (max-width: 1400px) {
        .log { width: 240px; }
        .hud-ability { min-width: 78px; padding: 7px 8px; font-size: 11px; }
        .hud-catalyst { min-width: 70px; padding: 3px 6px; font-size: 10px; }
        /* Width only — `min-height: 44px` above is never overridden. */
      }
      @media (max-width: 1100px) {
        /* The log stops being a column and becomes a short strip above the HUD,
           so the board keeps the full width — on a laptop the board is what you
           are actually looking at. */
        .log { top: auto; left: 0; width: auto; height: 116px; bottom: 132px;
          padding: 10px 14px; border-left: none; border-top: 1px solid var(--grid-line); }
        .hud { grid-template-columns: auto 1fr auto; gap: 10px; padding: 8px 12px 10px; }
        .hud-bars { min-width: 150px; }
        .hud-portrait { width: 38px; height: 38px; font-size: 18px; }
        .hud-lock { font-size: 13px; padding: 8px 14px; }
        h1 { font-size: 16px; }
      }
      @media (max-width: 820px) {
        /* Narrower than this the character panel is the first thing to go —
           its HP/energy are also on the unit's own billboarded bars. */
        .hud-left { display: none; }
        .hud { grid-template-columns: 1fr auto; }
      }
    </style>
  </head>
  <body>
    <div id="board"></div>
    <aside id="log" class="log"></aside>
    <div id="app">
      <h1>CARDS — Duel Arena</h1>
      <div id="status"></div>
      <div id="controls" class="hud"></div>
      <footer>M2 hot-seat · order entry, resolution & playback driven entirely by the engine</footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
