name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Engine tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Client build
        run: npm run build
      - name: Bundle budget (BUNDLE1)
        run: npm run size -w @cards/client
      # ASSET-WEIGHT-BUDGET: its own number, on purpose. The JS budget counts
      # `dist/assets/*.js` and nothing in `public/`, where the models live — and
      # one rigged character already outweighs the whole gzipped bundle. Needs no
      # build: `public/models/` is checked in.
      - name: Asset weight budget (ASSET-WEIGHT-BUDGET)
        run: npm run size:assets -w @cards/client
      - name: Determinism guard (no randomness/clock/IO in engine)
        run: |
          # Widened guard (CLAUDE.md rule 1): no clock, no RNG, no floats-from-random,
          # no wall-clock timers, no crypto, no direct DOM/network/Node imports.
          if grep -rnE "Math\.random|Date\.now|new Date|performance\.now|\bDate\(|crypto\.|require\(|process\.|\bfetch\(|from '(fs|path|os|crypto|node:)" packages/engine/src; then
            echo "::error::Forbidden nondeterminism/IO in packages/engine/src (CLAUDE.md rule 1)"
            exit 1
          fi

# RENDER-VERIFY lives in its own workflow (render-verify.yml), NOT here.
# `deploy-pages.yml` fires on this workflow concluding success, so anything in
# this file is a release gate. The render job needs a ~280 MB CDN browser
# download and a headless GPU stack, and an outage in either would have blocked
# publishing an urgent engine or docs fix. It still runs on every PR as a
# pre-merge signal — a red check there is the guardrail; it just no longer holds
# the release hostage. Ruled in docs/reviews/2026-08-25.md.
