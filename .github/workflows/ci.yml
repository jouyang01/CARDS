name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Engine tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Client build
        run: npm run build
      - name: Determinism guard (no randomness/clock in engine)
        run: |
          if grep -rnE "Math\.random|Date\.now|new Date\(" packages/engine/src; then
            echo "::error::Forbidden nondeterminism in packages/engine/src (CLAUDE.md rule 1)"
            exit 1
          fi
