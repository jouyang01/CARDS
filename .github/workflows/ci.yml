name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Engine tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Client build
        run: npm run build
      - name: Bundle budget (BUNDLE1)
        run: npm run size -w @cards/client
      - name: Determinism guard (no randomness/clock/IO in engine)
        run: |
          # Widened guard (CLAUDE.md rule 1): no clock, no RNG, no floats-from-random,
          # no wall-clock timers, no crypto, no direct DOM/network/Node imports.
          if grep -rnE "Math\.random|Date\.now|new Date|performance\.now|\bDate\(|crypto\.|require\(|process\.|\bfetch\(|from '(fs|path|os|crypto|node:)" packages/engine/src; then
            echo "::error::Forbidden nondeterminism/IO in packages/engine/src (CLAUDE.md rule 1)"
            exit 1
          fi

  # RENDER-VERIFY: the only check that can see what the renderer composited.
  # `gl.readPixels`/`toDataURL` come back all-black off the WebGL canvas, so the
  # rendered output is unreachable from a unit test — a real browser taking real
  # screenshots is the only thing that catches "it drew nothing". Separate job so
  # a browser install never slows the fast feedback above.
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Cache the browser binaries — ~280 MB per run otherwise. This job gates
      # the Pages deploy (deploy-pages.yml only fires when CI concludes
      # success), so a CDN hiccup here stops the site publishing; fewer
      # downloads is fewer chances to be blocked by someone else's outage.
      #
      # The install below still runs unconditionally rather than being skipped
      # on a cache hit: with a warm cache it is a fast no-op, and a stale or
      # mis-keyed cache then costs time instead of correctness.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-
      # Only Chromium: the suite asserts composited colours, not cross-browser
      # behaviour, so the other engines would cost minutes and prove nothing.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: packages/client
      - name: Render smoke test
        run: npm run test:e2e
        working-directory: packages/client
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: render-verify-trace
          path: packages/client/test-results/
          retention-days: 7
