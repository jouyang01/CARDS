name: Deploy to GitHub Pages
# Deploy only runs after the CI workflow succeeds on main, so a red build
# (failing tests, typecheck, or the determinism guard) can never publish to
# the live site. Manual runs via workflow_dispatch are still allowed.
#
# CI is the CORE checks only. RENDER-VERIFY is a separate workflow on purpose
# (see ci.yml): a broken engine or build must never publish, but a browser
# download failing must never stop an urgent fix from shipping.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    # Gate: proceed only when CI passed (workflow_run) or a human triggered it.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build client (base path = repo name)
        run: npm run build
        env:
          GH_PAGES_BASE: /${{ github.event.repository.name }}/
          # M3-DEPLOY-PREP: where the Worker is. The deployed client is on Pages
          # and the Worker is on workers.dev, so this is the one thing a build
          # cannot derive from the page it will be served from.
          #
          # A repository *variable* rather than a secret: it is a public hostname
          # that ships in the bundle, and putting it in the settings rather than
          # in this file means changing it does not need a commit. Empty until
          # the owner sets it (M3-DEPLOY-LIVE), and empty means same-origin —
          # so the Pages build keeps working, with the networked path simply not
          # reaching a server yet.
          VITE_WORKER_ORIGIN: ${{ vars.WORKER_ORIGIN }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/client/dist
      - id: deployment
        uses: actions/deploy-pages@v4
